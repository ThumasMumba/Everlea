{% extends "base.html" %}
{% block title %}{{ code }} — Vows and Venues {% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-24 text-center">
  <p class="font-display text-6xl" style="color: var(--color-gold);">{{ code }}</p>
  <h1 class="font-display text-2xl mt-4" style="color: var(--color-forest-dark);">{{ message }}</h1>
  <a href="{{ url_for('index') }}" class="btn-primary inline-block mt-8 px-6 py-3 rounded-full text-sm font-semibold">
    Back to homepage
  </a>
</section>
{% endblock %}
