{% extends "base.html" %}
{% block title %}Log in — Everlea Weddings{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-16">
  <p class="divider-leaf text-xs tracking-[0.2em] uppercase font-semibold mb-6">Welcome back</p>
  <h1 class="font-display text-4xl" style="color: var(--color-forest-dark);">Log in to your account</h1>
  <p class="mt-2 text-sm" style="color: var(--color-sage);">Pick up where you left off with your venue search.</p>

  <form method="POST" action="{{ url_for('login') }}" class="mt-8 space-y-5">
    <div>
      <label for="email" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Email</label>
      <input type="email" id="email" name="email" required value="{{ email or '' }}"
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="you@example.com" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Password</label>
      <input type="password" id="password" name="password" required
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="Your password" />
    </div>

    <button type="submit" class="btn-primary w-full py-3 rounded-full text-sm font-semibold">
      Log in
    </button>
  </form>

  <p class="mt-6 text-sm text-center" style="color: var(--color-sage);">
    New to Everlea?
    <a href="{{ url_for('signup') }}" class="underline" style="color: var(--color-forest);">Create an account</a>
  </p>
  <p class="mt-2 text-xs text-center" style="color: var(--color-sage);">
    Venue administrator?
    <a href="{{ url_for('admin_login') }}" class="underline" style="color: var(--color-forest);">Admin login</a>
  </p>
</section>
{% endblock %}
