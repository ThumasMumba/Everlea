{% extends "base.html" %}
{% block title %}Sign up — Everlea Weddings{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-16">
  <p class="divider-leaf text-xs tracking-[0.2em] uppercase font-semibold mb-6">New here</p>
  <h1 class="font-display text-4xl" style="color: var(--color-forest-dark);">Create your account</h1>
  <p class="mt-2 text-sm" style="color: var(--color-sage);">Sign up to browse venues and request bookings.</p>

  <form method="POST" action="{{ url_for('signup') }}" class="mt-8 space-y-5">
    <div>
      <label for="name" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Full name</label>
      <input type="text" id="name" name="name" required value="{{ name or '' }}"
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="Chanda Mwansa" />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Email</label>
      <input type="email" id="email" name="email" required value="{{ email or '' }}"
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="you@example.com" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Password</label>
      <input type="password" id="password" name="password" required minlength="8"
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="At least 8 characters" />
    </div>

    <div>
      <label for="confirm_password" class="block text-sm font-medium mb-1" style="color: var(--color-ink);">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
        class="w-full rounded-lg border px-4 py-2.5 text-sm focus:outline-none"
        style="border-color: var(--color-line);" placeholder="Repeat your password" />
    </div>

    <button type="submit" class="btn-primary w-full py-3 rounded-full text-sm font-semibold">
      Create account
    </button>
  </form>

  <p class="mt-6 text-sm text-center" style="color: var(--color-sage);">
    Already have an account?
    <a href="{{ url_for('login') }}" class="underline" style="color: var(--color-forest);">Log in</a>
  </p>
</section>
{% endblock %}
